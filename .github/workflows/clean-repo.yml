name: Clean Repository (Keep .github only)

on:
  workflow_dispatch: # Actions ট্যাব থেকে ম্যানুয়ালি রান করার জন্য

permissions:
  contents: write

jobs:
  clean-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete all files except .github
        shell: bash
        run: |
          shopt -s extglob dotglob
          rm -rf !(.github|.|..)

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to delete or already clean."
          else
            git commit -m "chore: delete all files and folders except .github"
            git push
          fi

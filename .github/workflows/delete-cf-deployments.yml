name: Delete All Cloudflare Pages Deployments

# Manual trigger only — go to the Actions tab, pick this workflow, click
# "Run workflow", type your Cloudflare Pages project name, and run it.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages project name (exact, from the dashboard URL)'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Delete all deployments (keeps active production deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
        run: |
          prod_id=""
          while :; do
            ids=$(npx wrangler pages deployment list --project-name "$PROJECT_NAME" --json | jq -r '.[].Id')
            to_delete=$(echo "$ids" | grep -v -F -x "$prod_id" | grep .)
            if [ -z "$to_delete" ]; then
              echo "Done. Active production deployment kept: $prod_id"
              break
            fi
            echo "Deleting $(echo "$to_delete" | wc -l | tr -d ' ') deployment(s)..."
            while IFS= read -r id; do
              if ! npx wrangler pages deployment delete "$id" --project-name "$PROJECT_NAME" --force 2>&1 | tee /tmp/wrangler-del.log | grep -q "Successfully deleted"; then
                if grep -q "active production deployment" /tmp/wrangler-del.log; then
                  prod_id="$id"
                fi
              fi
            done <<< "$to_delete"
          done

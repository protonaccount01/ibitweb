name: Move Files to Root

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: 'Source folder name to move files from'
        required: true
        default: 'fixed'
        type: string

permissions:
  contents: write

jobs:
  move-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move Files to Root
        run: |
          shopt -s dotglob
          SOURCE_DIR="${{ github.event.inputs.source_folder }}"
          
          if [ -d "$SOURCE_DIR" ]; then
            mv "$SOURCE_DIR"/* .
            rm -rf "$SOURCE_DIR"
          else
            echo "Error: Directory '$SOURCE_DIR' does not exist."
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Moved all files from '${{ github.event.inputs.source_folder }}' to root"
            git push
          fi
          

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Board - IBIT Sylhet</title>
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/assets/js/sanitize.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen overflow-x-hidden">

    <div id="header-placeholder"></div>

    <main class="w-full flex-grow py-12 bg-slate-50">
        <div class="max-w-5xl mx-auto px-4" data-aos="fade-up" data-aos-duration="1000">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-black text-[#1a0b5e] uppercase tracking-wider mb-2">Notice Board</h1>
                <div class="w-24 h-1 bg-[#1a0b5e] mx-auto rounded-full"></div>
            </div>
            
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
                <div class="bg-[#1a0b5e] text-white flex justify-between items-center px-6 py-4 font-bold text-sm uppercase tracking-wider">
                    <div class="flex-grow">Notice Title</div>
                    <div class="w-32 text-right hidden sm:block">Published Date</div>
                </div>
                
                <div id="public-notice-list" class="divide-y divide-slate-100">
                    <div class="p-8 text-center text-slate-400 font-semibold">Loading all notices from database...</div>
                </div>
            </div>
        </div>
    </main>

    <div id="notice-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-70 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[95vh] flex flex-col relative overflow-hidden">
            <div class="bg-slate-100 p-5 border-b border-slate-200 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-[#1a0b5e]"></h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 font-bold text-3xl leading-none">&times;</button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto prose max-w-none text-slate-700 text-justify w-full h-full min-h-[50vh]"></div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-[#1a0b5e] text-white rounded font-bold hover:bg-blue-900 transition">Close</button>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50, easing: 'ease-in-out' });

        fetch('/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const mobileBtn = document.getElementById('mobile-btn');
                const mobileMenu = document.getElementById('mobile-menu');
                if(mobileBtn) mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            });

        fetch('/footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);

        // Fix: notices are kept in memory and referenced by id, instead of
        // being stringified into onclick="..." attributes. That old approach
        // meant a title/content containing a quote character could break out
        // of the attribute and inject a new event handler — on top of the
        // innerHTML issue below. Building the DOM with textContent and
        // addEventListener removes both problems.
        let noticesById = {};

        fetch('/api/notices')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('public-notice-list');
                container.innerHTML = '';

                if(!data || data.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-slate-500 font-semibold">No notices published yet.</div>';
                    return;
                }

                noticesById = {};
                data.forEach(n => {
                    noticesById[n.id] = n;

                    const dateObj = new Date(n.created_at);
                    const formattedDate = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    const safeFilename = n.title.replace(/[^a-zA-Z0-9]/g, '_');
                    const finalPdfUrl = n.pdf_url ? `${n.pdf_url}?title=${encodeURIComponent(safeFilename)}` : '';

                    const row = document.createElement('div');
                    row.className = 'flex flex-col sm:flex-row justify-between sm:items-center px-6 py-5 hover:bg-slate-50 transition duration-150 ease-in-out group border-b border-slate-100 last:border-b-0 cursor-pointer';
                    row.addEventListener('click', () => openModal(n.id));

                    row.innerHTML = `
                        <div class="flex items-start gap-4 flex-grow pr-4 mb-4 sm:mb-0">
                            <div class="mt-1 text-blue-500 group-hover:text-[#1a0b5e] transition">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                            <div>
                                <span class="sm:hidden text-xs font-bold text-slate-500 mb-1 block">Published: ${formattedDate}</span>
                                <h3 class="notice-title-el text-slate-800 font-bold text-[15px] group-hover:text-blue-700 transition leading-snug underline decoration-slate-300 group-hover:decoration-blue-600 underline-offset-4"></h3>
                            </div>
                        </div>
                        <div class="flex items-center justify-between sm:justify-end sm:w-64 gap-4">
                            <span class="hidden sm:inline-block bg-blue-50 text-blue-700 font-bold text-xs px-3 py-1.5 rounded-full border border-blue-100 whitespace-nowrap">${formattedDate}</span>
                            <span class="pdf-btn-slot"></span>
                        </div>`;

                    // Title set via textContent -> never interpreted as HTML.
                    row.querySelector('.notice-title-el').textContent = n.title;

                    // PDF button built as a real element too, so the title
                    // used in the download filename never touches innerHTML.
                    const pdfSlot = row.querySelector('.pdf-btn-slot');
                    if (n.pdf_url) {
                        const a = document.createElement('a');
                        a.href = finalPdfUrl;
                        a.className = 'shrink-0 flex items-center gap-1.5 bg-[#1a0b5e] hover:bg-blue-800 text-white px-3 py-1.5 rounded text-xs font-bold transition shadow';
                        a.textContent = 'PDF';
                        a.addEventListener('click', (e) => e.stopPropagation());
                        pdfSlot.appendChild(a);
                    } else {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'shrink-0 flex items-center gap-1.5 bg-[#1a0b5e] hover:bg-blue-800 text-white px-3 py-1.5 rounded text-xs font-bold transition shadow';
                        btn.textContent = 'PDF';
                        btn.addEventListener('click', (e) => { e.stopPropagation(); downloadPDF(n.id); });
                        pdfSlot.appendChild(btn);
                    }

                    container.appendChild(row);
                });
            }).catch(() => {
                document.getElementById('public-notice-list').innerHTML = '<div class="p-8 text-center text-red-500 font-bold">Unable to load notices.</div>';
            });

        function openModal(id) {
            const n = noticesById[id];
            if (!n) return;

            document.getElementById('modal-title').textContent = n.title; // textContent, not innerHTML/innerText-with-html

            const modalContent = document.getElementById('modal-content');
            const raw = n.content;

            if (!raw || raw.trim() === '' || raw === 'null') {
                if (n.pdf_url) {
                    // Fixed value we control ourselves (the /files/ URL), not
                    // attacker input, so it's fine to build directly.
                    const finalPdfUrl = `${n.pdf_url}?title=${encodeURIComponent(n.title.replace(/[^a-zA-Z0-9]/g, '_'))}`;
                    modalContent.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.src = finalPdfUrl;
                    iframe.className = 'w-full h-[65vh] border border-slate-200 rounded-lg';
                    modalContent.appendChild(iframe);
                } else {
                    modalContent.innerHTML = '<p class="text-center text-slate-500 py-10 font-bold">No content available.</p>';
                }
            } else {
                // Fix: content is admin-authored rich-text HTML (from Quill)
                // and is run through the allowlist sanitizer before ever
                // touching innerHTML. See /assets/js/sanitize.js.
                modalContent.innerHTML = window.sanitizeHtml ? window.sanitizeHtml(raw) : '';
            }

            document.getElementById('notice-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('notice-modal').classList.add('hidden'); }

        function downloadPDF(id) {
            const n = noticesById[id];
            if (!n) return;
            const safeContent = window.sanitizeHtml ? window.sanitizeHtml(n.content || '') : '';
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'padding:40px; font-family:sans-serif; color:#0f172a; font-size:16px; line-height:1.6;';
            wrapper.innerHTML = safeContent;
            const filename = n.title.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf';
            const opt = { margin: 0, filename: filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(wrapper).save();
        }
    </script>
</body>
</html>

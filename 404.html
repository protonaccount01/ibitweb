<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | IBIT Sylhet</title>
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen overflow-x-hidden">

    <div id="header-placeholder"></div>

    <main class="w-full flex-grow flex items-center justify-center py-20 bg-slate-50 relative overflow-hidden">
        
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0 opacity-5 pointer-events-none">
            <h1 class="text-[15rem] md:text-[25rem] font-black text-[#1a0b5e] leading-none">404</h1>
        </div>

        <div class="text-center px-4 z-10 relative" data-aos="zoom-in" data-aos-duration="800">
            <div class="w-24 h-24 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm border-2 border-white">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            
            <h2 class="text-3xl sm:text-4xl font-black text-[#1a0b5e] mb-4 uppercase tracking-wider">Page Not Found</h2>
            <p class="text-slate-500 mb-8 max-w-md mx-auto text-lg">
                Sorry, the page or document you are looking for does not exist, has been removed, or the link is broken.
            </p>
            
            <a href="/" class="inline-flex items-center gap-2 bg-[#1a0b5e] hover:bg-blue-900 text-white px-8 py-3.5 rounded font-bold transition shadow-lg uppercase tracking-wide text-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to Home
            </a>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50, easing: 'ease-in-out' });

        // Load Header dynamically
        fetch('/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const mobileBtn = document.getElementById('mobile-btn');
                const mobileMenu = document.getElementById('mobile-menu');
                if(mobileBtn) mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            })
            .catch(error => console.error('Error loading header:', error));

        // Load Footer dynamically
        fetch('/footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data)
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
